<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Park Di Biase - Login</title>

    <link rel="stylesheet" href="/Login/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <section class="s1"> 
        <div class="login-box">

            <div class="left-panel">

                <img src="Imagem/logo.png.png" alt="Logo">

                <h1>Login</h1>
                <div class="line"></div>
                <p>Acesse sua conta para continuar</p>
            </div>


            <div class="right-panel">
                <form id="loginForm">
                    <div class="input-group">
                        <label>USUÁRIO</label>
                        <input id="usuario" type="text" placeholder="Digite seu usuário">
                    </div>

                    <div class="input-group">
                        <label>SENHA</label>
                        <input id="senha" type="password" placeholder="Digite sua senha">
                    </div>

                    <a href="#" class="forgot">
                        Esqueceu sua senha?
                    </a>

                    <button type="submit">
                        ENTRAR
                    </button>
                    <div style="text-align: center; margin-top: 20px;">
                        <a href="registro.html" class="forgot" style="margin-bottom: 0;">Não tem conta? Cadastre-se</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script>document.getElementById("loginForm").addEventListener("submit", function(e){ e.preventDefault(); window.location.href = "/Dashboard/index.html"; });</script>
    <script src="/Login/script.js"></script>
</body>
</html>
